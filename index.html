<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO HD HACK</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
overflow-x:hidden;
}

/* LOGIN */

#loginPage{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:360px;
background:#0d0d0d;
padding:30px;
border-radius:25px;
border:2px solid #00ff99;
box-shadow:0 0 25px #00ff99;
}

.logo{
text-align:center;
font-size:40px;
font-weight:bold;
color:#00ff99;
margin-bottom:30px;
text-shadow:0 0 20px #00ff99;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
outline:none;
border-radius:15px;
background:#151515;
color:white;
font-size:16px;
border:1px solid #00ff99;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:15px;
background:#00ff99;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

/* MAIN */

#mainPage{
display:none;
padding:20px;
}

.card{
background:#0d0d0d;
padding:25px;
border-radius:25px;
border:2px solid #00ff99;
box-shadow:0 0 25px #00ff99;
margin-bottom:25px;
}

.center{
text-align:center;
}

.period-title{
font-size:22px;
margin-bottom:10px;
color:#aaa;
}

.period{
font-size:30px;
font-weight:bold;
color:#00ff99;
word-break:break-all;
margin-bottom:20px;
}

.timer{
font-size:65px;
font-weight:bold;
color:#00ff99;
margin-bottom:20px;
}

.signal-title{
font-size:26px;
margin-bottom:15px;
}

.bigsmall{
font-size:65px;
font-weight:bold;
margin:15px 0;
}

.number{
font-size:90px;
font-weight:bold;
margin:10px 0;
}

.color{
font-size:40px;
font-weight:bold;
margin-top:10px;
}

.history-title{
font-size:35px;
margin-bottom:20px;
text-align:center;
}

.history-item{
background:#161616;
padding:15px;
border-radius:15px;
margin-top:12px;
font-size:22px;
}

.footer{
text-align:center;
color:#888;
margin-top:20px;
font-size:18px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<div class="logo">
PRO HD HACK
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- MAIN -->

<div id="mainPage">

<div class="logo">
PRO HD HACK
</div>

<div class="card center">

<div class="period-title">
CURRENT PERIOD
</div>

<div class="period" id="period">
20260512100052251
</div>

<div class="timer" id="timer">
00:30
</div>

<div class="signal-title">
NEXT SIGNAL
</div>

<div class="bigsmall" id="signal">
BIG
</div>

<div class="number" id="number">
0
</div>

<div class="color" id="color">
VIOLET
</div>

</div>

<div class="card">

<div class="history-title">
LIVE HISTORY
</div>

<div id="history"></div>

</div>

<div class="footer">
PRO HD HACK VIP SERVER
</div>

</div>

<script>

/* LOGIN */

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user === "admin" && pass === "1234"){

document.getElementById("loginPage").style.display =
"none";

document.getElementById("mainPage").style.display =
"block";

}
else{

alert("Wrong Username or Password");

}

}

/* PERIOD */

let currentPeriod =
20260512100052251;

let lastRound = -1;

/* SIGNAL */

function generateSignal(){

let signal =
Math.random() < 0.5 ? "BIG" : "SMALL";

let number;

if(signal === "BIG"){

number =
Math.floor(Math.random()*5);

}
else{

number =
Math.floor(Math.random()*5)+5;

}

let color = "";

if([1,3,7,9].includes(number)){

color = "GREEN";

}
else if([2,4,6,8].includes(number)){

color = "RED";

}
else{

color = "VIOLET";

}

document.getElementById("signal").innerText =
signal;

document.getElementById("number").innerText =
number;

document.getElementById("color").innerText =
color;

/* HISTORY */

let history =
document.getElementById("history");

let item =
document.createElement("div");

item.className =
"history-item";

item.innerHTML =
"🎯 " + signal +
" | 🔢 " + number +
" | 🎨 " + color +
" | 🆔 " + currentPeriod;

history.prepend(item);

/* MAX 10 */

if(history.children.length > 10){

history.removeChild(history.lastChild);

}

}

/* REAL TIMER */

function updateRealTimer(){

let now =
new Date();

let sec =
now.getSeconds();

/*
30 second system
*/

let remain =
30 - (sec % 30);

if(remain === 30){

remain = 30;

}

if(remain < 10){

remain = "0" + remain;

}

document.getElementById("timer").innerText =
"00:" + remain;

/*
new round
*/

let currentRound =
Math.floor(sec / 30);

if(currentRound !== lastRound){

lastRound = currentRound;

if(sec === 0 || sec === 30){

currentPeriod++;

document.getElementById("period").innerText =
currentPeriod;

generateSignal();

}

}

}

setInterval(updateRealTimer,1000);

updateRealTimer();

generateSignal();

</script>

</body>
</html>
