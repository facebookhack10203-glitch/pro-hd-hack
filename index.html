<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PRO HD HACK</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* LOGIN */

#loginPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:360px;
    background:#0b0b0b;
    border:2px solid #00ff99;
    border-radius:25px;
    padding:30px;
    box-shadow:0 0 25px #00ff99;
}

.login-title{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#00ff99;
    margin-bottom:30px;
    text-shadow:0 0 20px #00ff99;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#111;
    color:white;
    font-size:16px;
    border:1px solid #00ff99;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#00ff99;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

#mainPage{
    display:none;
    padding:20px;
}

.title{
    text-align:center;
    font-size:55px;
    color:#00ff99;
    font-weight:bold;
    margin-top:10px;
    margin-bottom:20px;
    text-shadow:0 0 25px #00ff99;
}

.card{
    background:#0b0b0b;
    border-radius:30px;
    padding:25px;
    margin-bottom:25px;
    border:2px solid #00ff99;
    box-shadow:0 0 25px #00ff99;
}

.center{
    text-align:center;
}

.period{
    font-size:28px;
    color:#00ff99;
    margin-bottom:15px;
    word-break:break-all;
}

.timer{
    font-size:60px;
    font-weight:bold;
    color:#00ff99;
    margin-bottom:20px;
}

.signal-title{
    font-size:30px;
    margin-bottom:20px;
}

.bigsmall{
    font-size:65px;
    font-weight:bold;
    margin:15px 0;
}

.number{
    font-size:90px;
    font-weight:bold;
    margin:10px 0;
}

.color{
    font-size:50px;
    margin-top:10px;
}

.history-title{
    font-size:40px;
    text-align:center;
    margin-bottom:20px;
}

.history-item{
    background:#141414;
    padding:18px;
    border-radius:15px;
    margin-bottom:15px;
    font-size:28px;
}

.winrate{
    margin-top:20px;
    text-align:center;
    font-size:26px;
    color:#00ff99;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:20px;
    color:#888;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-title">
            PRO HD HACK
        </div>

        <div class="input-box">
            <input type="text" id="username" placeholder="Enter Username">
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Enter Password">
        </div>

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

    </div>

</div>

<!-- MAIN PAGE -->

<div id="mainPage">

    <div class="title">
        PRO HD HACK
    </div>

    <div class="card center">

        <div class="period" id="period">
            20260512100052188
        </div>

        <div class="timer" id="timer">
            00:18
        </div>

        <div class="signal-title">
            NEXT SIGNAL
        </div>

        <div class="bigsmall" id="bigsmall">
            BIG
        </div>

        <div class="number" id="number">
            3
        </div>

        <div class="color" id="color">
            GREEN
        </div>

    </div>

    <div class="card">

        <div class="history-title">
            LIVE HISTORY
        </div>

        <div id="history"></div>

        <div class="winrate" id="winrate">
            Accuracy : 92%
        </div>

    </div>

    <div class="footer">
        PRO HD HACK VIP SERVER
    </div>

</div>

<script>

/* LOGIN */

function login(){

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "1234"){

        document.getElementById("loginPage").style.display="none";
        document.getElementById("mainPage").style.display="block";

    }else{
        alert("Wrong Username or Password");
    }
}

/* TIMER + PERIOD */

let seconds = 18;

/*
    10-15 second ahead fix
*/

let currentPeriod = 20260512100052188;

function updateTimer(){

    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    if(sec < 10){
        sec = "0" + sec;
    }

    document.getElementById("timer").innerText =
        "00:" + sec;

    seconds--;

    if(seconds < 0){

        seconds = 29;

        currentPeriod++;

        document.getElementById("period").innerText =
            currentPeriod;

        generateSignal();
    }
}

setInterval(updateTimer,1000);

/* SIGNAL */

function generateSignal(){

    let randomType = Math.random() < 0.5 ? "BIG" : "SMALL";

    let number;

    if(randomType === "BIG"){

        number = Math.floor(Math.random() * 5);

    }else{

        number = Math.floor(Math.random() * 5) + 5;
    }

    let color = "";

    if([1,3,7,9].includes(number)){
        color = "GREEN";
    }
    else if([2,4,6,8].includes(number)){
        color = "RED";
    }
    else{
        color = "VIOLET";
    }

    document.getElementById("bigsmall").innerText =
        randomType;

    document.getElementById("number").innerText =
        number;

    document.getElementById("color").innerText =
        color;

    addHistory(randomType,number,color);
}

/* HISTORY */

function addHistory(type,number,color){

    let history = document.getElementById("history");

    let item = document.createElement("div");

    item.className = "history-item";

    item.innerHTML =
        "🎯 " + type +
        " | 🔢 " + number +
        " | 🎨 " + color;

    history.prepend(item);

    if(history.children.length > 10){
        history.removeChild(history.lastChild);
    }

    let fakeAccuracy =
        Math.floor(Math.random()*8)+92;

    document.getElementById("winrate").innerText =
        "Accuracy : " + fakeAccuracy + "%";
}

/* FIRST SIGNAL */

generateSignal();

</script>

</body>
</html>
