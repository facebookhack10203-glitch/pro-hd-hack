<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO HD HACK</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
overflow-x:hidden;
}

/* LOGIN */

#loginPage{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:360px;
background:#0d0d0d;
padding:30px;
border-radius:25px;
border:2px solid #00ff99;
box-shadow:0 0 25px #00ff99;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#00ff99;
margin-bottom:30px;
text-shadow:0 0 20px #00ff99;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
outline:none;
border-radius:15px;
background:#151515;
color:white;
font-size:16px;
border:1px solid #00ff99;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:15px;
background:#00ff99;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

/* MAIN */

#mainPage{
display:none;
padding:20px;
}

.card{
background:#0d0d0d;
padding:25px;
border-radius:25px;
border:2px solid #00ff99;
box-shadow:0 0 25px #00ff99;
margin-bottom:25px;
}

.center{
text-align:center;
}

.period-title{
font-size:22px;
margin-bottom:10px;
color:#aaa;
}

.period{
font-size:60px;
font-weight:bold;
color:#00ff99;
margin-bottom:20px;
}

.timer{
font-size:70px;
font-weight:bold;
color:#00ff99;
margin-bottom:20px;
text-shadow:0 0 15px #00ff99;
}

.signal-title{
font-size:28px;
margin-bottom:15px;
}

.bigsmall{
font-size:70px;
font-weight:bold;
margin:15px 0;
}

.number{
font-size:95px;
font-weight:bold;
margin:10px 0;
}

.color{
font-size:42px;
font-weight:bold;
margin-top:10px;
}

/* CONFIDENCE */

.confidence{
font-size:28px;
font-weight:bold;
color:#00ff99;
margin-top:15px;
}

.history-title{
font-size:35px;
margin-bottom:20px;
text-align:center;
}

.history-item{
background:#161616;
padding:15px;
border-radius:15px;
margin-top:12px;
font-size:20px;
word-break:break-all;
}

.footer{
text-align:center;
color:#888;
margin-top:20px;
font-size:18px;
}

</style>

</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-box">

<div class="logo">
PRO HD HACK
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- MAIN PAGE -->

<div id="mainPage">

<div class="logo">
PRO HD HACK
</div>

<div class="card center">

<div class="period-title">
CURRENT PERIOD
</div>

<div class="period" id="period">
481
</div>

<div class="timer" id="timer">
00:30
</div>

<div class="signal-title">
NEXT SIGNAL
</div>

<div class="bigsmall" id="signal">
BIG
</div>

<div class="number" id="number">
8
</div>

<div class="color" id="color">
RED
</div>

<!-- CONFIDENCE -->

<div class="confidence" id="confidence">
80% CONFIDENCE
</div>

</div>

<div class="card">

<div class="history-title">
LIVE HISTORY
</div>

<div id="history"></div>

</div>

<div class="footer">
PRO HD HACK VIP SERVER
</div>

</div>

<script>

/* LOGIN SYSTEM */

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

document.getElementById("loginPage").style.display =
"none";

document.getElementById("mainPage").style.display =
"block";

}else{

alert("Wrong Username or Password");

}

}

</script>

<!-- PERIOD SYSTEM -->

<script src="period.js"></script>

</body>
</html>
