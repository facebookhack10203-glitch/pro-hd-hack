<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO HD HACK</title>

<style>

body{
background:#000;
font-family:Arial;
color:white;
margin:0;
padding:20px;
text-align:center;
}

.logo{
font-size:35px;
font-weight:bold;
color:#00ff99;
margin-top:20px;
text-shadow:0 0 20px #00ff99;
}

.box{
background:#111;
border-radius:20px;
padding:20px;
margin-top:20px;
box-shadow:0 0 20px #00ff99;
}

.timer{
font-size:40px;
color:#00ff99;
margin:10px;
}

.signal{
font-size:45px;
font-weight:bold;
margin-top:15px;
}

.number{
font-size:70px;
margin-top:10px;
font-weight:bold;
}

.color{
font-size:35px;
margin-top:10px;
}

.history{
margin-top:20px;
text-align:left;
max-height:250px;
overflow:auto;
}

.item{
background:#1a1a1a;
padding:10px;
margin-top:10px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="logo">PRO HD HACK</div>

<div class="box">

<h2>NEXT SIGNAL</h2>

<div class="timer" id="timer">30</div>

<div class="signal" id="signal">BIG</div>

<div class="number" id="number">0</div>

<div class="color" id="color">VIOLET</div>

</div>

<div class="box">

<h2>LIVE HISTORY</h2>

<div class="history" id="history"></div>

</div>

<script>

let time = 30;

function generateSignal(){

let signal = Math.random() > 0.5 ? "BIG" : "SMALL";

let numbers = [];

if(signal === "BIG"){
numbers = [0,1,2,3,4];
}else{
numbers = [5,6,7,8,9];
}

let num = numbers[Math.floor(Math.random()*numbers.length)];

let color = "";

if(num == 0 || num == 5){
color = "VIOLET";
}
else if([1,3,7,9].includes(num)){
color = "GREEN";
}
else{
color = "RED";
}

document.getElementById("signal").innerText = signal;
document.getElementById("number").innerText = num;
document.getElementById("color").innerText = color;

let history = document.getElementById("history");

let item = document.createElement("div");

item.className = "item";

item.innerHTML =
"🎯 " + signal +
" | 🔢 " + num +
" | 🎨 " + color;

history.prepend(item);

}

setInterval(()=>{

time--;

document.getElementById("timer").innerText = time;

if(time <= 0){

generateSignal();

time = 30;

}

},1000);

generateSignal();

</script>

</body>
</html>
