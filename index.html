<script>

/* LOGIN */

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

document.getElementById("loginPage").style.display =
"none";

document.getElementById("mainPage").style.display =
"block";

startSystem();

}else{

alert("Wrong Username or Password");

}

}

/* =========================
   EXACT BDWIN24 SYNC
========================= */

/*
12:35:00 = 20260512100052350
12:35:30 = 20260512100052351
12:36:00 = 20260512100052352
*/

const basePeriod =
20260512100052350;

/* YEAR, MONTH(0=JAN), DAY, HOUR, MINUTE, SECOND */

const baseTime =
new Date(2025,4,12,0,35,0).getTime();

let lastPeriod = "";

/* =========================
   SIGNAL SYSTEM
========================= */

function generateSignal(period){

let signal =
Math.random()<0.5 ? "BIG":"SMALL";

let number;

if(signal==="BIG"){

number =
Math.floor(Math.random()*5);

}else{

number =
Math.floor(Math.random()*5)+5;

}

let color="VIOLET";

if([1,3,7,9].includes(number)){

color="GREEN";

}
else if([2,4,6,8].includes(number)){

color="RED";

}

document.getElementById("signal").innerText =
signal;

document.getElementById("number").innerText =
number;

document.getElementById("color").innerText =
color;

/* HISTORY */

let history =
document.getElementById("history");

let item =
document.createElement("div");

item.className =
"history-item";

item.innerHTML =
"🎯 "+signal+
" | 🔢 "+number+
" | 🎨 "+color+
" | 🆔 "+period;

history.prepend(item);

if(history.children.length>10){

history.removeChild(history.lastChild);

}

}

/* =========================
   MAIN SYSTEM
========================= */

function updateSystem(){

const now =
Date.now();

/* DIFFERENCE */

const diff =
now - baseTime;

/* EVERY 30 SEC */

const passedPeriods =
Math.floor(diff / 30000);

/* CURRENT PERIOD */

const currentPeriod =
basePeriod + passedPeriods;

/* TIMER */

const seconds =
Math.floor((now / 1000) % 30);

let remain =
30 - seconds;

if(remain === 30){

remain = 0;

}

let showRemain =
remain < 10 ? "0"+remain : remain;

/* SHOW */

document.getElementById("timer").innerText =
"00:"+showRemain;

document.getElementById("period").innerText =
currentPeriod;

/* NEW SIGNAL */

if(lastPeriod != currentPeriod){

lastPeriod =
currentPeriod;

generateSignal(currentPeriod);

}

}

/* START */

function startSystem(){

updateSystem();

setInterval(updateSystem,1000);

}

</script>
