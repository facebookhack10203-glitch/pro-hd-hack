<script>

/* LOGIN */

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

document.getElementById("loginPage").style.display =
"none";

document.getElementById("mainPage").style.display =
"block";

startSystem();

}else{

alert("Wrong Username or Password");

}

}

/* =========================
   EXACT BDWIN24 SYNC
========================= */

/*

1:56:00 AM
=
20260512100052392

EVERY 30 SEC +1

*/

/* BASE PERIOD */

let basePeriod =
20260512100052392;

/* BASE TIME */

let baseTime =
new Date(2025,4,12,1,56,0).getTime();

/* LAST PERIOD */

let lastPeriod = "";

/* =========================
   SIGNAL SYSTEM
========================= */

function generateSignal(period){

let signal =
Math.random() < 0.5 ? "BIG" : "SMALL";

let number;

if(signal === "BIG"){

number =
Math.floor(Math.random()*5);

}else{

number =
Math.floor(Math.random()*5)+5;

}

let color = "VIOLET";

if([1,3,7,9].includes(number)){

color = "GREEN";

}
else if([2,4,6,8].includes(number)){

color = "RED";

}

document.getElementById("signal").innerText =
signal;

document.getElementById("number").innerText =
number;

document.getElementById("color").innerText =
color;

/* HISTORY */

let history =
document.getElementById("history");

let item =
document.createElement("div");

item.className =
"history-item";

item.innerHTML =

"🎯 " + signal +
" | 🔢 " + number +
" | 🎨 " + color +
" | 🆔 " + period;

history.prepend(item);

if(history.children.length > 10){

history.removeChild(history.lastChild);

}

}

/* =========================
   MAIN SYSTEM
========================= */

function updateSystem(){

let now =
Date.now();

let diff =
now - baseTime;

/* EVERY 30 SEC */

let passedPeriods =
Math.floor(diff / 30000);

/* CURRENT PERIOD */

let currentPeriod =
(basePeriod + passedPeriods).toString();

/* TIMER */

let remain =
30 - Math.floor((diff % 30000) / 1000);

if(remain === 30){

remain = 0;

}

let showRemain =
remain < 10 ? "0"+remain : remain;

/* SHOW */

document.getElementById("timer").innerText =
"00:" + showRemain;

document.getElementById("period").innerText =
currentPeriod;

/* NEW SIGNAL */

if(lastPeriod != currentPeriod){

lastPeriod =
currentPeriod;

generateSignal(currentPeriod);

}

}

/* START */

function startSystem(){

updateSystem();

setInterval(updateSystem,1000);

}

</script>
