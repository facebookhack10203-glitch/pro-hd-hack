<script>

/* =========================
   LOGIN SYSTEM
========================= */

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

document.getElementById("loginPage").style.display =
"none";

document.getElementById("mainPage").style.display =
"block";

startSystem();

}else{

alert("Wrong Username or Password");

}

}

/* =========================
   EXACT BDWIN24 SYNC
========================= */

/*

SYNC DATA:

1:46:41 AM
=
20260512100052375

*/

const basePeriod =
20260512100052375;

/* EXACT BASE TIME */

const baseTime =
new Date(2025,4,12,1,46,41).getTime();

/* LAST PERIOD */

let lastPeriod = "";

/* =========================
   SIGNAL SYSTEM
========================= */

function generateSignal(period){

let signal =
Math.random() < 0.5 ? "BIG" : "SMALL";

let number;

/* BIG = 0-4 */
/* SMALL = 5-9 */

if(signal === "BIG"){

number =
Math.floor(Math.random()*5);

}else{

number =
Math.floor(Math.random()*5)+5;

}

/* COLOR */

let color = "VIOLET";

if([1,3,7,9].includes(number)){

color = "GREEN";

}
else if([2,4,6,8].includes(number)){

color = "RED";

}

/* SHOW */

document.getElementById("signal").innerText =
signal;

document.getElementById("number").innerText =
number;

document.getElementById("color").innerText =
color;

/* HISTORY */

let history =
document.getElementById("history");

let item =
document.createElement("div");

item.className =
"history-item";

item.innerHTML =

"🎯 " + signal +
" | 🔢 " + number +
" | 🎨 " + color +
" | 🆔 " + period;

history.prepend(item);

/* MAX HISTORY */

if(history.children.length > 10){

history.removeChild(history.lastChild);

}

}

/* =========================
   MAIN LIVE SYSTEM
========================= */

function updateSystem(){

/* CURRENT TIME */

const now =
Date.now();

/* DIFFERENCE */

const diff =
now - baseTime;

/* EVERY 30 SEC = +1 */

const passedPeriods =
Math.floor(diff / 30000);

/* CURRENT PERIOD */

const currentPeriod =
basePeriod + passedPeriods;

/* =========================
   REAL TIMER
========================= */

const remain =
30 - Math.floor((diff % 30000) / 1000);

/* FORMAT */

let showRemain =
remain < 10 ? "0"+remain : remain;

/* SHOW */

document.getElementById("timer").innerText =
"00:" + showRemain;

document.getElementById("period").innerText =
currentPeriod;

/* =========================
   NEW SIGNAL
========================= */

if(lastPeriod != currentPeriod){

lastPeriod =
currentPeriod;

generateSignal(currentPeriod);

}

}

/* =========================
   START SYSTEM
========================= */

function startSystem(){

updateSystem();

setInterval(updateSystem,1000);

}

</script>
