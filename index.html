<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:system-ui,sans-serif;
}

/* BACKGROUND */
.game-background{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
}

iframe{
width:100%;
height:100%;
border:none;
}

/* GRID */
.cyber-grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,102,153,.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,102,153,.04) 1px, transparent 1px);
background-size:25px 25px;
animation:gridMove 8s linear infinite;
pointer-events:none;
z-index:2;
}

@keyframes gridMove{
0%{background-position:0 0;}
100%{background-position:50px 50px;}
}

/* MAIN BOX */
.box-container{
position:fixed;
top:130px;
left:15px;
width:240px;
background:rgba(10,10,10,.97);
border-radius:22px;
padding:15px;
z-index:9999;
overflow:hidden;
color:#fff;
box-shadow:
0 0 25px rgba(255,0,85,.25),
0 15px 35px rgba(0,0,0,.9);
}

/* ROTATING BORDER */
.box-container::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:
conic-gradient(
#ff66a3,
#ffffff,
#ff0033,
#ffffff,
#ff66a3
);
animation:rotateBorder 3s linear infinite;
z-index:-2;
}

.box-container::after{
content:'';
position:absolute;
inset:3px;
background:#0b0b0b;
border-radius:20px;
z-index:-1;
}

@keyframes rotateBorder{
100%{transform:rotate(360deg);}
}

/* HEADER */
.box-header{
display:flex;
justify-content:space-between;
align-items:center;
padding-bottom:10px;
margin-bottom:12px;
border-bottom:1px dashed rgba(255,255,255,.2);
}

.box-title{
font-size:12px;
font-weight:900;
letter-spacing:1px;
text-shadow:
0 0 10px #ff66a3,
0 0 20px #fff;
}

.tg-icon{
width:24px;
height:24px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(45deg,#ff66a3,#fff);
text-decoration:none;
}

/* INPUT */
.pass-input{
width:100%;
padding:11px;
border-radius:12px;
border:2px solid #ff66a3;
background:#000;
color:#fff;
outline:none;
margin-bottom:12px;
font-size:11px;
text-align:center;
}

.pass-input:focus{
border-color:#fff;
box-shadow:0 0 15px rgba(255,255,255,.5);
}

/* BUTTON */
.btn-login{
width:100%;
padding:11px 0;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
background:
linear-gradient(
45deg,
#ff66a3,
#ffffff,
#ff0033
);
color:#000;
}

/* CLOCK */
.live-clock{
font-size:10px;
margin-bottom:10px;
text-align:center;
font-family:monospace;
}

/* SIGNAL */
.signal-box{
background:
linear-gradient(
180deg,
rgba(20,10,10,.9),
rgba(0,0,0,.98)
);
border:2px solid #ff66a3;
border-radius:16px;
padding:14px 10px;
position:relative;
overflow:hidden;
}

.signal-box::before{
content:'';
position:absolute;
left:0;
width:100%;
height:2px;
background:#fff;
box-shadow:
0 0 15px #ff0033,
0 0 25px #ff66a3;
animation:scan 2s linear infinite;
}

@keyframes scan{
0%{top:5%;opacity:0;}
10%{opacity:1;}
90%{opacity:1;}
100%{top:95%;opacity:0;}
}

.period-title{
font-size:11px;
font-weight:bold;
background:
linear-gradient(90deg,#ff66a3,#fff);
padding:4px 12px;
border-radius:30px;
color:#000;
display:inline-block;
}

.ai-label{
font-size:8px;
margin-top:10px;
letter-spacing:1px;
color:#ccc;
}

.prediction-value{
font-size:23px;
font-weight:900;
margin:8px 0;
color:#fff;
text-shadow:
0 0 15px #fff,
0 0 25px #ff66a3,
0 0 35px #ff0033;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.07);
}
}

.timer-countdown{
font-size:15px;
font-family:monospace;
font-weight:bold;
padding:4px 10px;
border-radius:10px;
background:rgba(255,255,255,.08);
display:inline-block;
margin-top:4px;
}

/* STATUS */
.ai-status{
margin-top:10px;
display:flex;
justify-content:center;
align-items:center;
gap:6px;
font-size:8px;
font-weight:bold;
color:#ff66a3;
}

.dot{
width:7px;
height:7px;
background:#ff66a3;
border-radius:50%;
position:relative;
}

.dot::after{
content:'';
position:absolute;
inset:-4px;
border:1px solid #ff0033;
border-radius:50%;
animation:ring 1.2s infinite;
}

@keyframes ring{
100%{
transform:scale(2);
opacity:0;
}
}

/* CONTROL BUTTONS */
.btn-row{
display:flex;
gap:10px;
margin-top:12px;
}

.btn{
flex:1;
padding:9px 0;
border:none;
border-radius:12px;
font-size:10px;
font-weight:bold;
cursor:pointer;
color:#fff;
}

.btn-hide{
background:#111;
border:1px solid #ff66a3;
}

.btn-exit{
background:#ff0033;
border:1px solid #fff;
}

.footer-id{
margin-top:10px;
font-size:7px;
color:#999;
text-align:center;
font-family:monospace;
}

/* SHORTCUT */
#shortcutIcon{
position:fixed;
top:40%;
left:10px;
width:55px;
height:55px;
border-radius:50%;
border:3px solid #ff66a3;
display:none;
z-index:10000;
box-shadow:
0 0 20px #ff66a3,
0 0 10px #fff;
cursor:pointer;
animation:float 2s infinite;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

</style>
</head>

<body>

<script>

/* ==========================
   ULTRA SECURITY SYSTEM
========================== */

const API_URL =
"https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";

let lastProcessedPeriod = "";

/* DEVTOOLS BLOCK */
(function(){

function detectDevTools(){

const widthThreshold =
window.outerWidth - window.innerWidth > 160;

const heightThreshold =
window.outerHeight - window.innerHeight > 160;

if(widthThreshold || heightThreshold){

document.body.innerHTML = `
<div style="
background:#000;
color:#ff0033;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-family:monospace;
text-align:center;
padding:20px;">

SECURITY BREACH DETECTED

</div>
`;

}
}

setInterval(detectDevTools,1000);

})();

/* DISABLE RIGHT CLICK */
document.addEventListener(
"contextmenu",
e => e.preventDefault()
);

/* DISABLE SHORTCUTS */
document.addEventListener(
"keydown",
function(e){

if(
e.key === "F12" ||
(e.ctrlKey && e.shiftKey && e.key === "I") ||
(e.ctrlKey && e.shiftKey && e.key === "J") ||
(e.ctrlKey && e.key === "u") ||
(e.ctrlKey && e.key === "s")
){
e.preventDefault();
}

}
);

/* AUTO LOGIN */
window.onload = () => {

const saved =
localStorage.getItem(SESSION_KEY);

if(saved === "AUTHORIZED"){

isAuthorized = true;

document.getElementById(
"loginSection"
).style.display = "none";

document.getElementById(
"signalSection"
).style.display = "block";

updateHackEngine();

}

};

/* LOGIN FUNCTION */
function verifyPassword(){

const now = Date.now();

if(now < lockUntil){

let remain =
Math.ceil(
(lockUntil - now)/1000
);

alert(
"SYSTEM LOCKED : " +
remain +
"s"
);

return;
}

const inputPass =
document.getElementById(
"passInput"
).value.trim();

const encodedInput =
btoa(inputPass);

if(encodedInput === ENCODED_PASS){

isAuthorized = true;

localStorage.setItem(
SESSION_KEY,
"AUTHORIZED"
);

document.getElementById(
"loginSection"
).style.display = "none";

document.getElementById(
"signalSection"
).style.display = "block";

updateHackEngine();

console.clear();

}else{

loginAttempts++;

document.getElementById(
"passInput"
).style.borderColor = "#ff0000";

setTimeout(()=>{

document.getElementById(
"passInput"
).style.borderColor = "#ff66a3";

},1000);

if(loginAttempts >= MAX_ATTEMPTS){

lockUntil =
Date.now() + 60000;

alert(
"MAXIMUM ATTEMPTS EXCEEDED\nLOCKED FOR 60s"
);

loginAttempts = 0;

}else{

alert(
"ACCESS DENIED\nRemaining Attempts : " +
(MAX_ATTEMPTS - loginAttempts)
);

}

}

}

/* UPDATE ENGINE */
async function updateHackEngine(){

if(!isAuthorized) return;

let calculatedPeriodStr = "";

try{

const response =
await fetch(API_URL + "?t=" + Date.now());

const jsonResult =
await response.json();

if(
jsonResult &&
jsonResult.data &&
jsonResult.data.list &&
jsonResult.data.list.length > 0
){

let latest =
jsonResult.data.list[0];

let currentRawPeriod =
latest.issueNumber || latest.issue;

let nextPeriodInt =
BigInt(currentRawPeriod) + 1n;

calculatedPeriodStr =
nextPeriodInt.toString();

generateAIResult(
parseInt(latest.number)
);

}

}catch(error){

console.log("SAFE MODE ACTIVE");

}

if(
!calculatedPeriodStr ||
calculatedPeriodStr.includes("NaN")
){

let d = new Date();

let totalSeconds =
(d.getHours()*3600) +
(d.getMinutes()*60) +
d.getSeconds();

let currentPeriodIndex =
Math.floor(totalSeconds/30)+1;

calculatedPeriodStr =
d.getFullYear() +
String(d.getMonth()+1).padStart(2,'0') +
String(d.getDate()).padStart(2,'0') +
"1000" +
String(currentPeriodIndex).padStart(5,'0');

generateAIResult(NaN);

}

document.getElementById(
"periodDisplay"
).innerText =
"PERIOD: " +
calculatedPeriodStr.slice(-4);

}

/* AI RESULT */
function generateAIResult(lastNumber){

let resultText = "";

const patterns = [

"BIG 5,7,9",
"SMALL 0,2,4",
"BIG 6,8",
"SMALL 1,3",
"BIG 7,8,9",
"SMALL 0,1,2"

];

if(!isNaN(lastNumber)){

if(lastNumber >= 5){

resultText =
Math.random() > 0.5
?
"SMALL 0,2,4"
:
"SMALL 1,3,4";

}else{

resultText =
Math.random() > 0.5
?
"BIG 6,8,9"
:
"BIG 5,7,9";

}

}else{

let dynamicIndex =
Math.floor(Date.now()/1000)
% patterns.length;

resultText =
patterns[dynamicIndex];

}

document.getElementById(
"predictDisplay"
).innerText = resultText;

}

/* CLOCK + TIMER */
setInterval(()=>{

let now = new Date();

if(isAuthorized){

document.getElementById(
"liveClock"
).innerText =
now.toLocaleTimeString()
+ " [LIVE]";

}

let ms = now.getTime();

let remainingSeconds =
30 - (Math.floor(ms/1000)%30);

if(isAuthorized){

document.getElementById(
"timerDisplay"
).innerText =
remainingSeconds + "s";

}

let currentBlock =
Math.floor(ms/30000);

if(currentBlock !== lastProcessedPeriod){

lastProcessedPeriod =
currentBlock;

if(isAuthorized){

updateHackEngine();

let status =
document.getElementById(
"statusText"
);

status.innerText =
"CORE RE-INDEXED";

status.style.color = "#fff";

setTimeout(()=>{

status.innerText =
"SYSTEM ACTIVE";

status.style.color =
"#ff66a3";

},2000);

}

}

},1000);

/* DRAG SYSTEM */
const box =
document.getElementById("hackBox");

let isDragging = false;

let offsetX, offsetY;

function startDrag(e){

if(
e.target.tagName === "INPUT" ||
e.target.tagName === "BUTTON" ||
e.target.closest("a")
)return;

isDragging = true;

let clientX =
e.touches
?
e.touches[0].clientX
:
e.clientX;

let clientY =
e.touches
?
e.touches[0].clientY
:
e.clientY;

offsetX =
clientX - box.offsetLeft;

offsetY =
clientY - box.offsetTop;

}

function doDrag(e){

if(!isDragging)return;

let clientX =
e.touches
?
e.touches[0].clientX
:
e.clientX;

let clientY =
e.touches
?
e.touches[0].clientY
:
e.clientY;

box.style.left =
(clientX-offsetX)+"px";

box.style.top =
(clientY-offsetY)+"px";

}

function stopDrag(){

isDragging = false;

}

box.addEventListener(
"mousedown",
startDrag
);

document.addEventListener(
"mousemove",
doDrag
);

document.addEventListener(
"mouseup",
stopDrag
);

box.addEventListener(
"touchstart",
startDrag
);

document.addEventListener(
"touchmove",
doDrag
);

document.addEventListener(
"touchend",
stopDrag
);

/* HIDE/SHOW */
function hidePanel(){

document.getElementById(
"hackBox"
).style.display = "none";

document.getElementById(
"shortcutIcon"
).style.display = "block";

}

function showPanel(){

document.getElementById(
"hackBox"
).style.display = "block";

document.getElementById(
"shortcutIcon"
).style.display = "none";

}

/* EXIT */
function exitPanel(){

if(
confirm(
"ARE YOU SURE TO SHUTDOWN?"
)
){

localStorage.removeItem(
SESSION_KEY
);

window.location.reload();

}

}

/* AUTO CLEAR */
setInterval(()=>{

console.clear();

},2000);

/* TAB DETECTION */
document.addEventListener(
"visibilitychange",
()=>{

if(document.hidden && isAuthorized){

document.getElementById(
"statusText"
).innerText =
"BACKGROUND DETECTED";

}else if(isAuthorized){

document.getElementById(
"statusText"
).innerText =
"SYSTEM ACTIVE";

}

}
);

/* FRAME BREAK */
if(window.top !== window.self){

try{

window.top.location =
window.self.location;

}catch(e){

document.body.innerHTML = "";

}

}

/* RANDOM TOKEN */
const SECURE_RUNTIME_TOKEN =
Math.random().toString(36).substring(2)
+
Date.now();

console.log(
"%cSECURE TOKEN ACTIVE",
"color:red;font-size:20px;"
);

</script>
